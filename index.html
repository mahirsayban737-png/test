<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #ffecd2 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Hearts Background */
        .heart {
            position: fixed;
            font-size: 20px;
            animation: float 10s linear infinite;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Sparkles */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: gold;
            border-radius: 50%;
            animation: sparkle 3s linear infinite;
            pointer-events: none;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Title Animation */
        .title {
            font-size: 4rem;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(255,105,180,0.8);
            animation: pulse 2s ease-in-out infinite, glitch 3s infinite;
            margin-bottom: 30px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .title:hover {
            transform: scale(1.1) rotate(-2deg);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glitch {
            0%, 90%, 100% { text-shadow: 0 0 20px rgba(255,255,255,0.8); }
            92% { text-shadow: -3px 0 #ff00ff, 3px 0 #00ffff; }
            94% { text-shadow: 3px 0 #ff00ff, -3px 0 #00ffff; }
            96% { text-shadow: -3px 0 #00ffff, 3px 0 #ff00ff; }
        }

        /* Instruction Text */
        .instruction {
            color: white;
            font-size: 1.3rem;
            margin-bottom: 40px;
            text-align: center;
            opacity: 0.9;
            animation: bounce 2s infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Clickable Items Container */
        .items-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        /* Base Clickable Item */
        .click-item {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            user-select: none;
        }

        .click-item:hover {
            transform: translateY(-5px) scale(1.1);
        }

        .click-item:active {
            transform: scale(0.95);
        }

        /* Different item types */
        .heart-item { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); }
        .flower-item { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .star-item { background: linear-gradient(135deg, #ffd700, #ffaa00); }
        .gift-item { background: linear-gradient(135deg, #667eea, #764ba2); }
        .kiss-item { background: linear-gradient(135deg, #ff69b4, #ff1493); }

        /* Growth stages */
        .size-1 { width: 100px; height: 100px; font-size: 3rem; }
        .size-2 { width: 150px; height: 150px; font-size: 4rem; animation: wobble 1s ease-in-out infinite; }
        .size-3 { width: 220px; height: 220px; font-size: 5rem; animation: spin 3s linear infinite, wobble 1s ease-in-out infinite; }
        .size-4 { width: 320px; height: 320px; font-size: 7rem; animation: crazy 0.5s ease-in-out infinite, rainbow 2s linear infinite; }
        .size-5 { 
            width: 450px; 
            height: 450px; 
            font-size: 10rem; 
            animation: explode-prep 0.3s ease-in-out infinite, rainbow 1s linear infinite;
            z-index: 100;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes crazy {
            0% { transform: scale(1) rotate(0deg) skew(0deg); }
            25% { transform: scale(1.1) rotate(90deg) skew(5deg); }
            50% { transform: scale(1) rotate(180deg) skew(0deg); }
            75% { transform: scale(1.1) rotate(270deg) skew(-5deg); }
            100% { transform: scale(1) rotate(360deg) skew(0deg); }
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        @keyframes explode-prep {
            0%, 100% { transform: scale(1); box-shadow: 0 0 50px rgba(255,255,255,0.8); }
            50% { transform: scale(1.2); box-shadow: 0 0 100px rgba(255,255,255,1), 0 0 150px rgba(255,105,180,0.8); }
        }

        /* Explosion Effect */
        .explosion {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
        }

        .particle {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: particle-fly 2s ease-out forwards;
        }

        @keyframes particle-fly {
            0% { 
                transform: translate(0, 0) scale(1); 
                opacity: 1; 
            }
            100% { 
                transform: translate(var(--tx), var(--ty)) scale(0); 
                opacity: 0; 
            }
        }

        /* Message Reveal */
        .hidden-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            z-index: 2000;
            max-width: 90%;
            box-shadow: 0 20px 100px rgba(0,0,0,0.5);
            animation: messageAppear 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes messageAppear {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }

        .hidden-message h2 {
            font-size: 3rem;
            background: linear-gradient(135deg, #667eea, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .hidden-message p {
            font-size: 1.3rem;
            color: #555;
            line-height: 1.8;
